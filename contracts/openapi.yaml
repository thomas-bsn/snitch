  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "snitch_session"
      },
      "workerBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "EmbeddingValidation": {
        "type": "object",
        "required": [
          "validation_token",
          "dimensions",
          "model",
          "expires_at"
        ],
        "properties": {
          "validation_token": {
            "type": "string"
          },
          "dimensions": {
            "type": "integer"
          },
          "model": {
            "type": "string"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "EmbeddingSettings": {
        "type": "object",
        "required": [
          "url",
          "model",
          "url_from_environment",
          "model_from_environment"
        ],
        "properties": {
          "url": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "url_from_environment": {
            "type": "boolean"
          },
          "model_from_environment": {
            "type": "boolean"
          }
        }
      },
      "ClipAnalysisStep": {
        "type": "object",
        "required": [
          "step",
          "status",
          "reason",
          "job_id",
          "attempt",
          "input_version",
          "profile",
          "forced",
          "started_at",
          "finished_at",
          "updated_at"
        ],
        "properties": {
          "step": {
            "type": "string",
            "enum": [
              "preparation",
              "transcription",
              "indexing",
              "diarization",
              "fingerprints",
              "matching"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "waiting",
              "running",
              "retry",
              "blocked",
              "failed",
              "done",
              "not_applicable",
              "not_yet_supported"
            ]
          },
          "reason": {
            "type": "string",
            "description": "Code stable : awaiting_preparation, awaiting_previous_step, clip_not_ready, audio_track_selection_required, clip_ready, awaiting_worker, awaiting_compatible_worker, queue_paused, transcription_version_mismatch, transcription_not_validated, worker_not_claiming, run_cancelled, running, retry_scheduled, completed, reused_existing, kept_for_corrections, job_dead, job_cancelled, job_failed, outside_scope, transcription_required, awaiting_transcription, awaiting_indexer, semantic_search_unavailable, semantic_index_failed, microphone_track, microphone_direct_attribution, no_speakers, awaiting_fingerprints, matching_failed, upstream_failed."
          },
          "job_id": {
            "type": "integer",
            "nullable": true,
            "format": "int64"
          },
          "attempt": {
            "type": "integer"
          },
          "input_version": {
            "type": "string",
            "nullable": true,
            "description": "Version d'entrée du job suivi par l'étape (historique)."
          },
          "profile": {
            "type": "string",
            "nullable": true,
            "description": "Profil (pipeline) du job suivi par l'étape."
          },
          "forced": {
            "type": "boolean",
            "description": "Étape relancée par une réanalyse, malgré un résultat valide."
          },
          "failure_code": {
            "allOf": [
              {
                "$ref": "#/components/schemas/FailureCode"
              }
            ],
            "description": "File de tâches seulement, étape en échec : Cause d'échec persistée du dernier échec du job suivi (jamais de texte brut) ; absente sans cause connue."
          },
          "recommended_action": {
            "type": "string",
            "description": "File de tâches seulement : code de l'action conseillée, décidé par le serveur. Étape en échec : action de la Cause d'échec (catalogue des jobs). Attente de Worker (awaiting_worker, awaiting_compatible_worker) d'un job prêt : start_worker ; jamais pour une reprise différée."
          },
          "started_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "events": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AnalysisStepEvent"
            },
            "description": "Historique des analyses seulement : événements persistés du job suivi par l'étape (tentatives, reprises, échecs), du plus ancien au plus récent ; absent ailleurs ou sans job."
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "AnalysisStepEvent": {
        "allOf": [
          {
            "$ref": "#/components/schemas/JobEvent"
          },
          {
            "type": "object",
            "properties": {
              "worker_name": {
                "type": "string",
                "description": "Nom du Worker de l'événement, quand il est encore enregistré ; jamais un chemin."
              }
            }
          }
        ]
      },
      "ClipAnalysisRun": {
        "type": "object",
        "required": [
          "id",
          "clip_id",
          "scope",
          "status",
          "started_by",
          "created_at",
          "updated_at",
          "finished_at",
          "mode",
          "forced_steps",
          "confirmed_replace_corrections",
          "confirmed_replace_validations",
          "confirmed_stake_at",
          "pending_voices",
          "steps"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "clip_id": {
            "type": "integer",
            "format": "int64"
          },
          "scope": {
            "type": "string",
            "enum": [
              "transcription",
              "voice",
              "full"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "completed",
              "failed",
              "cancelled"
            ]
          },
          "started_by": {
            "type": "integer",
            "nullable": true,
            "format": "int64"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "mode": {
            "type": "string",
            "enum": [
              "missing",
              "full",
              "steps"
