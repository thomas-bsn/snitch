        },
        "description": "Administrateurs uniquement. Les chemins sont réservés à l'administration et ne sont jamais retournés aux membres."
      },
      "post": {
        "operationId": "createSource",
        "parameters": [
          {"in": "header", "name": "Origin", "required": true, "schema": {"type": "string"}},
          {"in": "header", "name": "X-CSRF-Token", "required": true, "schema": {"type": "string"}}
        ],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SourceInput"}}}},
        "responses": {
          "201": {"description": "Source créée et première réconciliation planifiée", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Source"}}}},
          "default": {"description": "Error (400 path outside configured roots, 409 duplicate, 422 inaccessible path, 503 roots unconfigured)", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
        },
        "description": "Administrateurs uniquement. Le chemin doit être un dossier existant sous une racine CLIPS_ROOTS, sans sortie par lien symbolique."
      }
    },
