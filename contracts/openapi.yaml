                    "type": "string",
                    "enum": [
                      "stopping",
                      "starting",
                      "online",
                      "failed"
                    ]
                  },
                  "result": {
                    "type": "string",
                    "maxLength": 200
                  }
                }
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "État enregistré"
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
