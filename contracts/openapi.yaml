    "/api/admin/jobs": {
      "get": {
        "operationId": "listJobs",
        "parameters": [
          {
            "name": "workflow",
            "in": "query",
            "description": "Paginate clips with their latest job per step. Total counts clips. active includes unfinished or cancelled clips; done requires every latest step to have succeeded.",
            "schema": {
              "type": "string",
              "enum": [
                "active",
                "done"
              ]
            }
          },
          {
            "in": "query",
            "name": "status",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "pending",
                "leased",
                "done",
                "failed",
                "retry_wait",
                "cancelled",
                "dead"
              ]
            }
          },
          {
            "in": "query",
            "name": "clip_id",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64",
              "minimum": 1
