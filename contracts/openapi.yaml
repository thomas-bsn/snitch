            "type": "string"
          }
        }
      },
      "Status": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string"
          }
        }
      },
      "Credentials": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          }
        }
      },
      "Bootstrap": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password",
          "code"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          },
          "code": {
            "type": "string"
          }
        }
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "username",
          "role",
          "approved"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "user"
            ]
          },
          "approved": {
            "type": "boolean"
          }
        }
      },
      "Session": {
        "type": "object",
        "required": [
          "user",
          "csrf_token"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "csrf_token": {
            "type": "string"
          }
        }
      },
      "Setup": {
        "type": "object",
        "required": [
          "initialized",
          "display_name",
          "discord_enabled",
          "phase",
          "deferred_steps"
        ],
        "properties": {
          "initialized": {
            "type": "boolean"
          },
          "display_name": {
            "type": "string"
          },
          "discord_enabled": {
            "type": "boolean",
            "description": "True only when both the Discord application identifier and its authenticated encrypted secret are available."
          },
          "phase": {
            "type": "integer"
          },
          "deferred_steps": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "client_id",
          "secret_configured",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string"
          },
          "secret_configured": {
            "type": "boolean",
            "description": "Whether a nonempty secret is stored. The secret itself is never returned."
          },
          "registration_approval": {
            "type": "boolean"
          }
        }
      },
      "SettingsInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "client_id",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string",
            "maxLength": 128,
            "description": "Required application identifier. Empty disables Discord and removes the stored secret. Whitespace-only values are rejected; saving does not verify credentials with Discord."
          },
          "client_secret": {
            "type": "string",
            "maxLength": 2048,
            "description": "Write-only application secret. Omit or send an empty string to retain the current secret. Enabling Discord requires a new or existing nonempty secret; whitespace-only values are rejected.",
            "writeOnly": true
          },
