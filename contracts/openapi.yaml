                },
                "name": {
                  "type": "string"
                }
              }
            }
          },
          "owners": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "id",
                "username"
              ],
              "properties": {
                "id": {
                  "type": "integer",
                  "format": "int64"
                },
                "username": {
                  "type": "string"
                }
              }
            }
          }
        }
