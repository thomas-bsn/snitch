          "end": {
            "type": "number",
            "minimum": 0
          },
          "text": {
            "type": "string"
          },
          "words": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/TranscriptWord"
            }
          },
          "local_speaker_id": {"type": "integer", "format": "int64", "description": "Locuteur local dominant du segment ; absent sans diarisation ou sans recouvrement."},
          "local_speaker_label": {"type": "string"},
          "local_speaker_decision_level": {"$ref": "#/components/schemas/DecisionLevel"},
          "local_speaker_person_id": {"type": "integer", "format": "int64", "description": "Personne du Locuteur local, si attribuée."},
          "local_speaker_person_name": {"type": "string"},
          "local_speaker_corrected": {"type": "boolean", "description": "Vrai si local_speaker_id est désigné par un utilisateur (phase 6) plutôt que déduit des tours de parole."},
          "index": {"type": "integer", "minimum": 0, "description": "Rang du segment dans la transcription (identité avec transcription_job_id)."},
          "original_text": {"type": "string", "description": "Texte de la transcription automatique, jamais modifié."},
          "corrected": {"type": "boolean", "description": "Vrai si text est un texte corrigé par un utilisateur."},
          "correction_version": {"type": "integer", "minimum": 0, "description": "Version à renvoyer comme expected_version ; 0 si jamais écrit."},
          "corrected_by": {"type": "string", "description": "Auteur de la correction du texte, si corrigé."},
          "corrected_at": {"type": "string", "format": "date-time", "description": "Date de la correction du texte, si corrigé."}
        }
      },
      "Transcription": {
        "type": "object",
        "required": [
          "provider",
          "model",
          "audio_stream_index",
          "segments"
