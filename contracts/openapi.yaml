            "type": "string",
            "enum": [
              "transcription",
              "voice",
              "full"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "completed",
              "failed",
              "cancelled"
            ]
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "pending_voices": {
            "type": "integer",
            "minimum": 0
          },
          "steps": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "step",
                "status",
                "reason",
                "updated_at"
              ],
              "properties": {
                "step": {
                  "type": "string",
                  "enum": [
                    "preparation",
                    "transcription",
                    "indexing",
                    "diarization",
                    "fingerprints",
                    "matching"
                  ]
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "waiting",
                    "running",
                    "retry",
                    "blocked",
                    "failed",
                    "done",
                    "not_applicable"
                  ]
                },
                "reason": {
                  "type": "string"
                },
                "updated_at": {
                  "type": "string",
                  "format": "date-time"
                }
              }
            }
          }
        }
      },
      "ClipAnalysisViewResponse": {
        "type": "object",
        "required": [
          "run"
        ],
        "properties": {
          "run": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ClipAnalysisView"
              }
            ],
            "nullable": true
          }
        }
      },
      "ClipAnalysisResponse": {
        "type": "object",
        "required": [
          "run"
        ],
        "properties": {
          "run": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ClipAnalysisRun"
              }
            ],
            "nullable": true
          }
        }
      },
      "AnalysisQueueRun": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ClipAnalysisRun"
          },
          {
            "type": "object",
            "required": [
              "clip_name",
              "pending_voices",
              "locations"
            ],
            "properties": {
              "clip_name": {
                "type": "string"
              },
              "locations": {
                "type": "array",
                "description": "Fichiers vidéo d'origine indexés du clip (hors fichiers introuvables), avec leur source et leur chemin complet persisté ; jamais un fichier de travail du Worker. Vide : chemin indisponible.",
                "items": {
                  "$ref": "#/components/schemas/ClipLocation"
                }
              },
              "pending_voices": {
                "type": "integer",
                "minimum": 0,
                "description": "Voix du clip encore inconnues ou ambiguës (liste de vérification) : une analyse terminée qui en laisse est seulement partiellement identifiée."
              }
            }
          }
        ]
      },
      "AnalysisRunHistory": {
        "type": "object",
        "required": [
          "items",
          "total",
          "page",
          "page_size"
