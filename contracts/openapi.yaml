        }
      }
    },
    "/api/admin/benchmarks/clips": {
      "get": {
        "operationId": "listBenchmarkClips",
        "security": [
          {
            "session": []
          }
        ],
        "description": "Administrateurs uniquement. Clips partagés pouvant entrer dans un corpus : avec transcription ou voix validée par un humain, hors dossiers privés. Les clips privés ou rangés seulement dans un dossier privé ne sont jamais proposés.",
        "responses": {
          "200": {
            "description": "Clips",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BenchmarkClipList"
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/benchmarks/models": {
      "get": {
        "operationId": "listBenchmarkModels",
        "security": [
          {
            "session": []
          }
        ],
        "description": "Administrateurs uniquement. Modèles comparables pour l'étape. Empreinte et diarisation : catalogue, avec le nombre de Workers où chacun est prêt. Transcription : le modèle de production seulement ; les autres sont nommés par l'administrateur, car seul un Worker joint le service de transcription.",
        "parameters": [
          {
            "in": "query",
            "name": "stage",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "fingerprint",
                "transcription",
                "diarization"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Modèles",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BenchmarkModelList"
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/benchmarks/activation": {
      "get": {
        "operationId": "previewBenchmarkActivation",
        "security": [
          {
            "session": []
          }
        ],
        "description": "Administrateurs uniquement. Aperçu du changement du modèle de production (transcription ou diarisation) : modèle remplacé, Workers prêts, clips qu'une réanalyse mettrait en jeu dont ceux qui portent un travail humain. L'empreinte passe par sa transition (benchmark_activation_unsupported).",
        "parameters": [
          {
            "in": "query",
            "name": "stage",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "transcription",
                "diarization"
              ]
            }
          },
          {
            "in": "query",
            "name": "model",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Aperçu",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BenchmarkActivationPreview"
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "confirmBenchmarkActivation",
        "security": [
          {
            "session": []
          }
        ],
        "description": "Administrateurs uniquement. Change le modèle utilisé pour le travail à venir. Jamais une réanalyse : rien n'est planifié, aucune correction ni validation n'est touchée. Exige la confirmation (benchmark_activation_confirm_required) et le modèle remplacé vu à l'aperçu (benchmark_activation_stale). Chaque changement est enregistré avec son auteur et le run.",
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BenchmarkActivationInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Modèle changé",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BenchmarkActivationResult"
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/voice-engines/families": {
      "get": {
        "operationId": "listEngineFamilies",
        "description": "Administrateur : les familles de bibliothèque que Snitch sait installer à la demande (table du serveur), avec version par défaut, tâches, contraintes matérielles et estimations de disque et de durée. Ne dépend d'aucune Release signée importée.",
        "responses": {
          "200": {
            "description": "Familles supportées",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EngineFamilies"
                }
              }
            }
          },
          "default": {
            "description": "Erreur (401 session required, 403 permission)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/voice-engines/on-demand-orders": {
      "post": {
        "operationId": "createOnDemandEngineOrders",
        "description": "Administrateur : ordonne l'installation d'un engine à la demande (famille de bibliothèque et version, version par défaut de la famille si omise) sur un ou plusieurs Workers. Aucune enveloppe signée n'est acceptée : l'identité est dérivée de la famille, de la version et de la tâche. Le matériel du Worker est contrôlé avant tout ordre ; clé idempotente, génération, livraison, accusé, inventaire et causes d'échec sont ceux des ordres d'engine signés. Famille inconnue : 400 unsupported_engine_family.",
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Must equal the address of the request itself (scheme and host)"
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OnDemandEngineOrderInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Résultat par Worker",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VoiceEngineOrderResults"
                }
              }
            }
          },
          "default": {
            "description": "Erreur (400 unsupported_engine_family ou invalid_engine_order, 401 session required, 403 permission)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/voice-engines/on-demand-plan": {
      "post": {
        "operationId": "planOnDemandEngine",
        "description": "Administrateur : plan d'un ordre d'engine à la demande (famille, version par défaut si omise) sur des Workers : disque cumulé, durée estimée et refus de matériel par Worker. Lecture seule : ne crée ni ordre ni identité de registre. Confirmation : createOnDemandEngineOrders.",
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Must equal the address of the request itself (scheme and host)"
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OnDemandEnginePlanInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Plan",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OnDemandEnginePlan"
                }
              }
            }
          },
          "default": {
            "description": "Erreur (400 unsupported_engine_family ou invalid_engine_order, 401 session required, 403 permission)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/workers/{id}/voice-model-orders/preview": {
      "get": {
        "operationId": "previewVoiceModelOrder",
        "description": "Administrateur : ce que la confirmation d'un ordre de modèle doit montrer avant tout ordre : l'engine à la demande dont le modèle a besoin (famille, version, tâche), son état sur ce Worker (absent, en cours, prêt), le disque et la durée estimés tant qu'il reste à installer, et la cause de refus matériel éventuelle. Un modèle embarqué ou à adaptateur signé n'a besoin d'aucun engine à la demande (engine_required false). Famille inconnue de la table : 400 unsupported_engine_family, sans aucun ordre. Ne crée rien.",
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 64
            }
          },
          {
            "in": "query",
            "name": "model_id",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Aperçu",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VoiceModelOrderPreview"
                }
              }
            }
          },
          "default": {
            "description": "Erreur (400 unsupported_engine_family ou invalid_voice_model, 401 session required, 403 permission, 404 worker_not_found)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "snitch_session"
      },
      "workerBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "EmbeddingValidation": {
        "type": "object",
        "required": [
          "validation_token",
          "dimensions",
          "model",
          "expires_at"
        ],
        "properties": {
          "validation_token": {
            "type": "string"
          },
          "dimensions": {
            "type": "integer"
          },
          "model": {
            "type": "string"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "EmbeddingSettings": {
        "type": "object",
        "required": [
          "url",
          "model",
          "url_from_environment",
          "model_from_environment"
        ],
        "properties": {
          "url": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "url_from_environment": {
            "type": "boolean"
          },
          "model_from_environment": {
            "type": "boolean"
          }
        }
      },
      "ClipAnalysisStep": {
        "type": "object",
        "required": [
          "step",
          "status",
          "reason",
          "job_id",
          "attempt",
          "input_version",
          "profile",
          "forced",
          "started_at",
          "finished_at",
          "updated_at"
        ],
        "properties": {
          "step": {
            "type": "string",
            "enum": [
              "preparation",
              "transcription",
              "indexing",
              "diarization",
              "fingerprints",
              "matching"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "waiting",
              "running",
              "retry",
              "blocked",
              "failed",
              "done",
              "not_applicable",
              "not_yet_supported"
            ]
          },
          "reason": {
            "type": "string",
            "description": "Code stable : awaiting_preparation, awaiting_previous_step, clip_not_ready, audio_track_selection_required, clip_ready, awaiting_worker, awaiting_compatible_worker, queue_paused, transcription_version_mismatch, transcription_not_validated, worker_not_claiming, run_cancelled, running, retry_scheduled, completed, reused_existing, kept_for_corrections, job_dead, job_cancelled, job_failed, outside_scope, transcription_required, awaiting_transcription, awaiting_indexer, semantic_search_unavailable, semantic_index_failed, microphone_track, microphone_direct_attribution, no_speakers, awaiting_fingerprints, matching_failed, upstream_failed."
          },
          "job_id": {
            "type": "integer",
            "nullable": true,
            "format": "int64"
          },
          "attempt": {
            "type": "integer"
          },
          "input_version": {
            "type": "string",
            "nullable": true,
            "description": "Version d'entrée du job suivi par l'étape (historique)."
          },
          "profile": {
            "type": "string",
            "nullable": true,
            "description": "Profil (pipeline) du job suivi par l'étape."
          },
          "forced": {
            "type": "boolean",
            "description": "Étape relancée par une réanalyse, malgré un résultat valide."
          },
          "failure_code": {
            "allOf": [
              {
                "$ref": "#/components/schemas/FailureCode"
              }
            ],
            "description": "File de tâches seulement, étape en échec : Cause d'échec persistée du dernier échec du job suivi (jamais de texte brut) ; absente sans cause connue."
          },
          "recommended_action": {
            "type": "string",
            "description": "File de tâches seulement : code de l'action conseillée, décidé par le serveur. Étape en échec : action de la Cause d'échec (catalogue des jobs). Attente de Worker (awaiting_worker, awaiting_compatible_worker) d'un job prêt : start_worker ; jamais pour une reprise différée."
          },
          "started_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "events": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AnalysisStepEvent"
            },
            "description": "Historique des analyses seulement : événements persistés du job suivi par l'étape (tentatives, reprises, échecs), du plus ancien au plus récent ; absent ailleurs ou sans job."
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "AnalysisStepEvent": {
        "allOf": [
          {
            "$ref": "#/components/schemas/JobEvent"
          },
          {
            "type": "object",
            "properties": {
              "worker_name": {
                "type": "string",
                "description": "Nom du Worker de l'événement, quand il est encore enregistré ; jamais un chemin."
              }
            }
          }
        ]
      },
      "ClipAnalysisRun": {
        "type": "object",
        "required": [
          "id",
          "clip_id",
          "scope",
          "status",
          "started_by",
          "created_at",
          "updated_at",
          "finished_at",
          "mode",
          "forced_steps",
          "confirmed_replace_corrections",
          "confirmed_replace_validations",
          "confirmed_stake_at",
          "pending_voices",
          "steps"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "clip_id": {
            "type": "integer",
            "format": "int64"
          },
          "scope": {
            "type": "string",
            "enum": [
              "transcription",
              "voice",
              "full"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "completed",
              "failed",
              "cancelled"
            ]
          },
          "started_by": {
            "type": "integer",
            "nullable": true,
            "format": "int64"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "mode": {
            "type": "string",
            "enum": [
              "missing",
              "full",
              "steps"
            ]
          },
          "forced_steps": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "transcription",
                "indexing",
                "diarization"
              ]
            }
          },
          "confirmed_replace_corrections": {
            "type": "boolean"
          },
          "confirmed_replace_validations": {
            "type": "boolean"
          },
          "confirmed_stake_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time",
            "description": "Instant jusqu'auquel le travail humain en jeu a été montré et confirmé : la réanalyse ne rend obsolète que ce qui existait alors (nul sans étape relancée)."
          },
          "pending_voices": {
            "type": "integer",
            "minimum": 0,
            "description": "Voix du clip encore inconnues ou ambiguës (liste de vérification), lues en direct : une analyse terminée qui en laisse est seulement partiellement identifiée."
          },
          "audio_plan_id": {
            "type": "integer",
            "format": "int64",
            "nullable": true,
            "description": "Plan audio de l'analyse d'un clip à plusieurs pistes (absent pour une analyse monopiste). Sert à lire et confirmer les pertes d'une publication en attente."
          },
          "steps": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ClipAnalysisStep"
            }
          }
        }
      },
      "ClipAnalysisView": {
        "type": "object",
        "description": "Vue en lecture seule pour tout utilisateur qui peut ouvrir le clip : état et code de raison stable de chaque étape, sans job, Worker ni détail d'erreur.",
        "required": [
          "clip_id",
          "scope",
          "status",
          "created_at",
          "updated_at",
          "finished_at",
          "pending_voices",
          "steps"
        ],
        "properties": {
          "clip_id": {
            "type": "integer",
            "format": "int64"
          },
          "scope": {
            "type": "string",
            "enum": [
              "transcription",
              "voice",
              "full"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "completed",
              "failed",
              "cancelled"
            ]
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "pending_voices": {
            "type": "integer",
            "minimum": 0
          },
          "steps": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "step",
                "status",
                "reason",
                "updated_at"
              ],
              "properties": {
                "step": {
                  "type": "string",
                  "enum": [
                    "preparation",
                    "transcription",
                    "indexing",
                    "diarization",
                    "fingerprints",
                    "matching"
                  ]
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "waiting",
                    "running",
                    "retry",
                    "blocked",
                    "failed",
                    "done",
                    "not_applicable"
                  ]
                },
                "reason": {
                  "type": "string"
                },
                "updated_at": {
                  "type": "string",
                  "format": "date-time"
                }
              }
            }
          }
        }
      },
      "ClipAnalysisViewResponse": {
        "type": "object",
        "required": [
          "run"
        ],
        "properties": {
          "run": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ClipAnalysisView"
              }
            ],
            "nullable": true
          }
        }
      },
      "ClipAnalysisResponse": {
        "type": "object",
        "required": [
          "run"
        ],
        "properties": {
          "run": {
            "allOf": [
              {
                "$ref": "#/components/schemas/ClipAnalysisRun"
              }
            ],
            "nullable": true
          }
        }
      },
      "AnalysisQueueRun": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ClipAnalysisRun"
          },
          {
            "type": "object",
            "required": [
              "clip_name",
              "pending_voices",
              "locations"
            ],
            "properties": {
              "clip_name": {
                "type": "string"
              },
              "locations": {
                "type": "array",
                "description": "Fichiers vidéo d'origine indexés du clip (hors fichiers introuvables), avec leur source et leur chemin complet persisté ; jamais un fichier de travail du Worker. Vide : chemin indisponible.",
                "items": {
                  "$ref": "#/components/schemas/ClipLocation"
                }
              },
              "pending_voices": {
                "type": "integer",
                "minimum": 0,
                "description": "Voix du clip encore inconnues ou ambiguës (liste de vérification) : une analyse terminée qui en laisse est seulement partiellement identifiée."
              }
            }
          }
        ]
      },
      "AnalysisRunHistory": {
        "type": "object",
        "required": [
          "items",
          "total",
          "page",
          "page_size"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AnalysisQueueRun"
            }
          },
          "total": {
            "type": "integer"
          },
          "page": {
            "type": "integer"
          },
          "page_size": {
            "type": "integer"
          }
        }
      },
      "ClipLocation": {
        "type": "object",
        "required": [
          "source"
        ],
        "properties": {
          "source": {
            "type": "string",
            "description": "Nom de la source indexée."
          },
          "path": {
            "type": "string",
            "description": "Chemin complet (racine de la source + chemin relatif). Absent pour un dossier privé."
          },
          "private": {
            "type": "boolean",
            "description": "Le fichier est dans un dossier privé : son chemin n'est pas envoyé."
          }
        }
      },
      "AnalysisQueueTask": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Job"
          },
          {
            "type": "object",
            "required": [
              "clip_name"
            ],
            "properties": {
              "clip_name": {
                "type": "string"
              },
              "failure_code": {
                "allOf": [
                  {
                    "$ref": "#/components/schemas/FailureCode"
