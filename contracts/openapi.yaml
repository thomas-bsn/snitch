  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "receipts_session"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "Status": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string"
          }
        }
      },
      "Credentials": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          }
        }
      },
      "Bootstrap": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password",
          "code"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          },
          "code": {
            "type": "string"
          }
        }
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "username",
          "role",
          "approved"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "user"
            ]
          },
          "approved": {
            "type": "boolean"
          }
        }
      },
      "Session": {
        "type": "object",
        "required": [
          "user",
          "csrf_token"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "csrf_token": {
            "type": "string"
          }
        }
      },
      "Setup": {
        "type": "object",
        "required": [
          "initialized",
          "display_name",
          "discord_enabled",
          "phase",
          "deferred_steps"
        ],
        "properties": {
          "initialized": {
            "type": "boolean"
          },
          "display_name": {
            "type": "string"
          },
          "discord_enabled": {
            "type": "boolean"
          },
          "phase": {
            "type": "integer"
          },
          "deferred_steps": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "client_id",
          "secret_configured",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string"
          },
          "secret_configured": {
            "type": "boolean"
          },
          "registration_approval": {
            "type": "boolean"
          }
        }
      },
      "SettingsInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "client_id",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string",
            "maxLength": 128
          },
          "client_secret": {
            "type": "string",
            "maxLength": 2048
          },
          "registration_approval": {
            "type": "boolean"
          }
        }
      },
      "Redirect": {
        "type": "object",
        "required": [
          "url"
        ],
        "properties": {
          "url": {
            "type": "string",
            "format": "uri"
          }
        }
      }
    }
  }
}
