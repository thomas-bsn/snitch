        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "receipts_session"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "Status": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string"
          }
        }
      },
      "Credentials": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          }
        }
      },
      "Bootstrap": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password",
          "code"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          },
          "code": {
            "type": "string"
          }
        }
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "username",
          "role",
          "approved"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "user"
            ]
          },
          "approved": {
            "type": "boolean"
          }
        }
      },
      "Session": {
        "type": "object",
        "required": [
          "user",
          "csrf_token"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "csrf_token": {
            "type": "string"
          }
        }
      },
      "Setup": {
        "type": "object",
        "required": [
          "initialized",
          "display_name",
          "discord_enabled",
          "phase",
          "deferred_steps"
        ],
        "properties": {
          "initialized": {
            "type": "boolean"
          },
          "display_name": {
            "type": "string"
          },
          "discord_enabled": {
            "type": "boolean",
            "description": "True only when both the Discord application identifier and its authenticated encrypted secret are available."
          },
          "phase": {
            "type": "integer"
          },
          "deferred_steps": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "client_id",
          "secret_configured",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string"
          },
          "secret_configured": {
            "type": "boolean",
            "description": "Whether a nonempty secret is stored. The secret itself is never returned."
          },
          "registration_approval": {
            "type": "boolean"
          }
        }
      },
      "SettingsInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "client_id",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string",
            "maxLength": 128,
            "description": "Required application identifier. Empty disables Discord and removes the stored secret. Whitespace-only values are rejected; saving does not verify credentials with Discord."
          },
          "client_secret": {
            "type": "string",
            "maxLength": 2048,
            "description": "Write-only application secret. Omit or send an empty string to retain the current secret. Enabling Discord requires a new or existing nonempty secret; whitespace-only values are rejected.",
            "writeOnly": true
          },
          "registration_approval": {
            "type": "boolean",
            "description": "Booléen obligatoire et non nul. Politique commune aux nouvelles inscriptions locales et Discord, sans approbation rétroactive des comptes déjà en attente."
          }
        }
      },
      "SourceInput": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name", "path"],
        "properties": {
          "name": {"type": "string", "minLength": 1, "maxLength": 80},
          "path": {"type": "string", "minLength": 1, "maxLength": 4096}
        }
      },
      "Source": {
        "type": "object",
        "required": ["id", "name", "path", "visibility", "enabled", "health"],
        "properties": {
          "id": {"type": "integer", "format": "int64"},
          "name": {"type": "string"},
          "path": {"type": "string", "description": "Visible uniquement aux administrateurs."},
          "visibility": {"type": "string", "enum": ["private", "shared"]},
          "enabled": {"type": "boolean"},
          "health": {"type": "string", "enum": ["ready", "unavailable", "warning"]},
          "health_message": {"type": "string"},
          "last_scan_at": {"type": "string", "format": "date-time", "nullable": true}
        }
      },
      "SourceList": {
        "type": "object",
        "required": ["allowed_roots", "items"],
        "properties": {
          "allowed_roots": {"type": "array", "items": {"type": "string"}},
          "items": {"type": "array", "items": {"$ref": "#/components/schemas/Source"}}
        }
      },
      "SourceFiles": {
        "type": "object",
        "required": ["items"],
        "properties": {
          "items": {"type": "array", "items": {"$ref": "#/components/schemas/SourceFile"}}
        }
      },
      "SourceFile": {
        "type": "object",
        "required": ["name", "relative_path", "status", "size_bytes", "modified_at", "recorded_at_estimated", "tracks"],
        "properties": {
          "name": {"type": "string"},
          "relative_path": {"type": "string"},
          "status": {"type": "string", "enum": ["waiting_stability", "ready", "unreadable", "missing"]},
          "clip_id": {"type": "integer", "format": "int64", "nullable": true},
          "error_code": {"type": "string"},
          "size_bytes": {"type": "integer", "format": "int64", "minimum": 0},
          "modified_at": {"type": "string", "format": "date-time"},
          "discovered_at": {"type": "string", "format": "date-time"},
          "recorded_at": {"type": "string", "format": "date-time"},
          "recorded_at_estimated": {"type": "boolean"},
          "duration_seconds": {"type": "number", "format": "double", "minimum": 0},
          "format_name": {"type": "string"},
          "video_codec": {"type": "string"},
          "audio_codec": {"type": "string"},
          "tracks": {"type": "array", "items": {"$ref": "#/components/schemas/MediaTrack"}}
        }
      },
      "MediaTrack": {
        "type": "object",
        "required": ["type", "codec"],
        "properties": {
          "type": {"type": "string"},
          "codec": {"type": "string"},
          "title": {"type": "string"},
          "language": {"type": "string"},
          "width": {"type": "integer"},
          "height": {"type": "integer"}
        }
      },
      "Redirect": {
        "type": "object",
        "required": [
          "url"
        ],
        "properties": {
          "url": {
            "type": "string",
            "format": "uri"
          }
        }
      }
    }
  }
}
