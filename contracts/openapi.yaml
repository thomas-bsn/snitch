          "200": {
            "description": "Page de tâches administrable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JobPage"
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Administrateurs uniquement. Aucun chemin local n'est exposé."
      },
      "post": {
        "operationId": "scheduleJob",
        "parameters": [
          {
            "in": "query",
            "name": "confirm_replace_corrections",
            "required": false,
            "description": "Vrai pour confirmer explicitement le remplacement des corrections humaines du clip par la retranscription. Sans lui, une retranscription d'un clip corrigé est refusée (409 corrections_would_be_replaced).",
