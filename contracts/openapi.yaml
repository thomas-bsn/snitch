  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "receipts_session"
      },
      "workerBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "Status": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string"
          }
        }
      },
      "Credentials": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          }
        }
      },
      "Bootstrap": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password",
          "code"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          },
          "code": {
            "type": "string"
          }
        }
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "username",
          "role",
          "approved"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "user"
            ]
          },
          "approved": {
            "type": "boolean"
          }
        }
      },
      "Session": {
        "type": "object",
        "required": [
          "user",
          "csrf_token"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "csrf_token": {
            "type": "string"
          }
        }
      },
      "Setup": {
        "type": "object",
        "required": [
          "initialized",
          "display_name",
          "discord_enabled",
          "phase",
          "deferred_steps"
        ],
        "properties": {
          "initialized": {
            "type": "boolean"
          },
          "display_name": {
            "type": "string"
          },
          "discord_enabled": {
            "type": "boolean",
            "description": "True only when both the Discord application identifier and its authenticated encrypted secret are available."
          },
          "phase": {
            "type": "integer"
          },
          "deferred_steps": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "client_id",
          "secret_configured",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string"
          },
          "secret_configured": {
            "type": "boolean",
            "description": "Whether a nonempty secret is stored. The secret itself is never returned."
          },
          "registration_approval": {
            "type": "boolean"
          }
        }
      },
      "SettingsInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "client_id",
          "registration_approval"
        ],
        "properties": {
          "client_id": {
            "type": "string",
            "maxLength": 128,
            "description": "Required application identifier. Empty disables Discord and removes the stored secret. Whitespace-only values are rejected; saving does not verify credentials with Discord."
          },
          "client_secret": {
            "type": "string",
            "maxLength": 2048,
            "description": "Write-only application secret. Omit or send an empty string to retain the current secret. Enabling Discord requires a new or existing nonempty secret; whitespace-only values are rejected.",
            "writeOnly": true
          },
          "registration_approval": {
            "type": "boolean",
            "description": "Booléen obligatoire et non nul. Politique commune aux nouvelles inscriptions locales et Discord, sans approbation rétroactive des comptes déjà en attente."
          }
        }
      },
      "UploadInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "filename",
          "size_bytes"
        ],
        "properties": {
          "filename": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024
          },
          "size_bytes": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "visibility": {
            "type": "string",
            "enum": [
              "private",
              "shared"
            ],
            "default": "shared"
          }
        }
      },
      "Upload": {
        "type": "object",
        "required": [
          "id",
          "original_name",
          "size_bytes",
          "offset_bytes",
          "chunk_size_bytes",
          "visibility",
          "status",
          "expires_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          },
          "original_name": {
            "type": "string"
          },
          "size_bytes": {
            "type": "integer",
            "format": "int64"
          },
          "offset_bytes": {
            "type": "integer",
            "format": "int64"
          },
          "chunk_size_bytes": {
            "type": "integer",
            "format": "int64"
          },
          "visibility": {
            "type": "string",
            "enum": [
              "private",
              "shared"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "uploading",
              "processing",
              "complete",
              "failed",
              "cancelled",
              "expired"
            ]
          },
          "clip_id": {
            "type": "integer",
            "format": "int64"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        }
      },
      "UploadList": {
        "type": "object",
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Upload"
            }
          }
        }
      },
      "UploadOffset": {
        "type": "object",
        "required": [
          "offset_bytes"
        ],
        "properties": {
          "offset_bytes": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "SourceInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "path"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          }
        }
      },
      "Job": {
        "type": "object",
        "required": [
          "id",
          "clip_id",
          "step",
          "input_version",
          "status",
          "priority",
          "attempts",
          "max_attempts",
          "lease_owner",
          "lease_expires_at",
          "next_attempt_at",
          "last_error",
          "created_at",
          "updated_at",
          "cycle"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "clip_id": {
            "type": "integer",
            "format": "int64"
          },
          "step": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_.-]{0,63}$"
          },
          "input_version": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "leased",
              "done",
              "failed",
              "retry_wait",
              "cancelled",
              "dead"
            ]
          },
          "priority": {
            "type": "integer",
            "minimum": -100,
            "maximum": 100
          },
          "attempts": {
            "type": "integer",
            "minimum": 0
          },
          "max_attempts": {
            "type": "integer",
            "minimum": 1
          },
          "lease_owner": {
            "type": "string",
            "nullable": true
          },
          "lease_expires_at": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "next_attempt_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_error": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "result": {
            "type": "object",
            "additionalProperties": true,
            "nullable": true
          },
          "cycle": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "JobInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "clip_id",
          "step",
          "input_version"
        ],
        "properties": {
          "clip_id": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "step": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_.-]{0,63}$"
          },
          "input_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "priority": {
            "type": "integer",
            "minimum": -100,
