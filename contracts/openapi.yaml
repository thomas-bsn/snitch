              "running",
              "completed",
              "cancelled"
            ]
          },
          "announced": {
            "type": "integer",
            "minimum": 0,
            "description": "Nombre d'empreintes confirmé au lancement."
          },
          "author": {
            "type": "string",
            "nullable": true
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time"
          },
          "rematched_at": {
            "type": "string",
            "nullable": true,
            "format": "date-time",
            "description": "Fin du rapprochement de toute la bibliothèque relancé à la fin du recalcul."
          },
          "report": {
            "$ref": "#/components/schemas/VoiceRecomputeReport"
          }
        }
      },
      "VoiceRecomputeState": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "transition_open"
        ],
        "properties": {
          "transition_open": {
            "type": "boolean"
          },
          "run": {
            "$ref": "#/components/schemas/VoiceRecomputeRun"
          }
        }
      },
      "VoiceEligibilityRequalification": {
        "type": "object",
        "description": "Une requalification tracée : auteur, règle appliquée, date et rapport avant/après.",
        "required": [
          "id",
          "rule_version",
          "author",
          "created_at",
          "changed",
          "missing_sources",
          "estimated",
          "original_vectors",
          "before",
          "after"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "rule_version": {
            "type": "integer",
            "minimum": 1
          },
          "author": {
            "type": "string",
            "nullable": true
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "changed": {
            "type": "integer",
            "minimum": 0,
            "description": "Empreintes de production dont l'éligibilité a changé."
          },
          "missing_sources": {
            "type": "integer",
            "minimum": 0,
            "description": "Empreintes requalifiées dont le clip n'a plus de source audio connue."
          },
          "estimated": {
            "type": "integer",
            "minimum": 0,
            "description": "Empreintes à Parole nette estimée."
          },
          "original_vectors": {
            "type": "integer",
            "minimum": 0,
            "description": "Empreintes gardant leur vecteur d'origine."
          },
          "before": {
            "$ref": "#/components/schemas/VoiceEligibilityOutcome"
          },
          "after": {
            "$ref": "#/components/schemas/VoiceEligibilityOutcome"
          }
        }
      },
      "VoiceScoreModeInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "cumulative",
              "best_sample"
            ],
            "description": "cumulative : cosinus avec la Référence de la Personne, moyenne de ses échantillons contributifs validés pondérée par leur Parole nette plafonnée. best_sample : meilleur cosinus avec un seul de ses échantillons comparables."
          }
        }
      },
      "VoiceScoreModeVersion": {
        "type": "object",
        "description": "Une version du mode de score. La version 1 est le mode par défaut de Snitch.",
        "required": [
          "version",
          "mode",
          "author",
          "created_at"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "mode": {
            "type": "string",
            "enum": [
              "cumulative",
              "best_sample"
            ],
            "description": "cumulative : cosinus avec la Référence de la Personne, moyenne de ses échantillons contributifs validés pondérée par leur Parole nette plafonnée. best_sample : meilleur cosinus avec un seul de ses échantillons comparables."
          },
          "author": {
            "type": "string",
            "nullable": true,
            "description": "Administrateur qui a choisi ce mode ; null pour le mode par défaut."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "VoiceScoreMode": {
        "type": "object",
        "description": "Mode de score du rapprochement (ADR 0064) : version active et historique.",
        "required": [
          "version",
          "mode",
          "author",
          "created_at",
          "history"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "mode": {
            "type": "string",
            "enum": [
              "cumulative",
              "best_sample"
            ],
            "description": "cumulative : cosinus avec la Référence de la Personne, moyenne de ses échantillons contributifs validés pondérée par leur Parole nette plafonnée. best_sample : meilleur cosinus avec un seul de ses échantillons comparables."
          },
          "author": {
            "type": "string",
            "nullable": true,
            "description": "Administrateur qui a choisi ce mode ; null pour le mode par défaut."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "history": {
            "type": "array",
            "description": "Vingt dernières versions, la plus récente d'abord.",
            "items": {
              "$ref": "#/components/schemas/VoiceScoreModeVersion"
            }
          }
        }
      },
      "PersonReferenceDiscard": {
        "type": "object",
        "required": [
          "reason",
          "count"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "enum": [
              "too_short",
              "overlap_only",
              "clipped",
              "low_quality",
              "no_fingerprint"
            ],
            "description": "Raison de l'écart : celle de l'empreinte du Locuteur local dans le groupe actif (too_short, overlap_only, clipped, low_quality), ou no_fingerprint quand la voix n'a aucune empreinte de production dans ce groupe."
          },
          "count": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "PersonReference": {
        "type": "object",
        "description": "La Référence de la Personne telle que le rapprochement l'utilise, dans le groupe d'empreinte (modèle, version, dimensions) actif, et son niveau. Le niveau est calculé par le serveur sur toutes les Personnes du groupe, quels que soient le lecteur et la page lue.",
        "required": [
          "level",
          "basis",
          "contributive_samples",
          "clips",
          "net_speech_seconds",
          "discarded"
        ],
        "properties": {
          "level": {
            "type": "string",
            "enum": [
              "good",
              "weak",
              "none"
            ],
            "description": "none sans échantillon contributif ; weak sur un seul clip ; sinon, à partir de 3 Personnes avec Référence dans le groupe, good à partir de la médiane de leur Parole nette et weak en dessous ; avec moins de 3 Références, good."
          },
          "basis": {
            "type": "string",
            "enum": [
              "no_sample",
              "single_clip",
              "few_references",
              "below_median",
              "median_or_more"
            ],
            "description": "Pourquoi la Référence a ce niveau."
          },
          "contributive_samples": {
            "type": "integer",
            "description": "Échantillons validés actifs qui entrent dans la Référence (empreinte contributive du groupe actif)."
          },
          "clips": {
            "type": "integer",
            "description": "Clips distincts de ces échantillons."
          },
          "net_speech_seconds": {
            "type": "number",
            "description": "Parole nette cumulée de ces échantillons, après plafond par échantillon."
          },
          "discarded": {
            "type": "array",
            "description": "Échantillons validés actifs écartés de la Référence, groupés par raison.",
            "items": {
              "$ref": "#/components/schemas/PersonReferenceDiscard"
            }
          }
        }
      },
      "VoiceFingerprintGroup": {
        "type": "object",
        "description": "Groupe d'empreintes (modèle, version, dimensions) : seules les empreintes d'un même groupe sont comparées.",
        "additionalProperties": false,
        "required": [
          "model",
          "model_version",
          "dimensions"
        ],
        "properties": {
          "model": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "model_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "dimensions": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2000
          }
        }
      },
      "VoiceGroupThresholds": {
        "type": "object",
        "description": "Une version des seuils appliqués à un groupe d'empreintes (ADR 0064). La plus haute version est en vigueur.",
        "required": [
          "version",
          "suggestion_threshold",
          "automatic_threshold",
          "ambiguity_margin",
          "source",
          "score_mode",
          "author",
          "created_at"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "suggestion_threshold": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "automatic_threshold": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "ambiguity_margin": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "source": {
            "type": "string",
            "enum": [
              "migration",
              "administrator",
              "proposal"
            ],
            "description": "migration : seuils de l'installation repris pour le groupe actif ; administrator : saisis ; proposal : proposition de la Précision mesurée appliquée par l'administrateur."
          },
          "score_mode": {
            "type": "string",
            "enum": [
              "cumulative",
              "best_sample"
            ],
            "description": "Mode de score actif au moment de l'application."
          },
          "author": {
            "type": "string",
            "nullable": true,
            "description": "Administrateur ; null pour Snitch (migration)."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "VoiceScoreBin": {
        "type": "object",
        "description": "Classe de score de largeur 0,05 ; un score négatif est compté dans la première classe, un score de 1 dans la dernière. Un score est une similarité cosinus, jamais une probabilité.",
        "required": [
          "from",
          "to",
          "same_person",
          "other_person"
        ],
        "properties": {
          "from": {
            "type": "number"
          },
          "to": {
            "type": "number"
          },
          "same_person": {
            "type": "integer",
            "description": "Scores d'un test contre la Référence de sa propre Personne."
          },
          "other_person": {
            "type": "integer",
            "description": "Scores d'un test contre la Référence d'une autre Personne."
          }
        }
      },
      "VoiceThresholdSweep": {
        "type": "object",
        "description": "Décision rejouée sur les tests à un jeu de seuils.",
        "required": [
          "automatic_threshold",
          "suggestion_threshold",
          "ambiguity_margin",
          "automatic",
          "errors",
          "to_verify",
          "unknown_automatic"
        ],
        "properties": {
          "automatic_threshold": {
            "type": "number"
          },
          "suggestion_threshold": {
            "type": "number",
            "description": "Seuil de suggestion utilisé : celui du groupe, abaissé au seuil automatique s'il le dépasse."
          },
          "ambiguity_margin": {
            "type": "number"
          },
          "automatic": {
            "type": "integer",
            "description": "Tests attribués automatiquement."
          },
          "errors": {
            "type": "integer",
            "description": "Attributions automatiques désignant une autre Personne que celle validée."
          },
          "to_verify": {
            "type": "integer",
            "description": "Tests laissés à vérifier (suggestion, ambiguïté ou inconnu)."
          },
          "unknown_automatic": {
            "type": "integer",
            "description": "Inconnus simulés (tests rejoués sans la Référence de leur Personne) reconnus à tort automatiquement."
          }
        }
      },
      "VoiceThresholdProposal": {
        "type": "object",
        "description": "Proposition de seuils : jamais appliquée sans action de l'administrateur.",
        "required": [
          "suggestion_threshold",
          "automatic_threshold",
          "ambiguity_margin",
          "figures"
        ],
        "properties": {
          "suggestion_threshold": {
            "type": "number"
          },
          "automatic_threshold": {
            "type": "number",
            "description": "Plus bas seuil, au centième, à partir duquel la mesure garde la précision minimale des critères d'activation et ne reconnaît aucun inconnu simulé."
          },
          "ambiguity_margin": {
            "type": "number"
          },
          "figures": {
            "$ref": "#/components/schemas/VoiceThresholdSweep"
          }
        }
      },
      "VoiceCalibrationMode": {
        "type": "object",
        "description": "Mesure d'un mode de score sur le groupe actif.",
        "required": [
          "mode",
          "tests",
          "persons",
          "same_person_scores",
          "other_person_scores",
          "distribution",
          "sweep",
          "current",
          "proposal",
          "withheld"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "cumulative",
              "best_sample"
            ]
          },
          "tests": {
            "type": "integer",
            "description": "Tests ayant une empreinte comparable dans le groupe ; chacun est aussi rejoué comme inconnu simulé."
          },
          "persons": {
            "type": "integer",
            "description": "Personnes ayant une Référence dans ce mode et au moins un test."
          },
          "same_person_scores": {
            "type": "integer"
          },
          "other_person_scores": {
            "type": "integer"
          },
          "distribution": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VoiceScoreBin"
            }
          },
          "sweep": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VoiceThresholdSweep"
            },
            "description": "Seuil automatique de 0,05 à 1 par pas de 0,05."
          },
          "current": {
            "allOf": [
              {
                "$ref": "#/components/schemas/VoiceThresholdSweep"
              }
            ],
            "nullable": true,
            "description": "Chiffres aux seuils appliqués au groupe ; null sans seuils appliqués."
          },
          "proposal": {
            "allOf": [
              {
                "$ref": "#/components/schemas/VoiceThresholdProposal"
              }
            ],
            "nullable": true
          },
          "withheld": {
            "type": "string",
            "enum": [
              "",
              "too_few",
              "no_safe_threshold"
            ],
            "description": "Raison de l'absence de proposition : too_few (effectifs trop faibles), no_safe_threshold (aucun seuil ne garde la précision sans reconnaître d'inconnu)."
          }
        }
      },
      "VoiceCalibration": {
        "type": "object",
        "description": "Calibration des seuils du groupe d'empreintes actif (ADR 0064), les deux modes de score côte à côte.",
        "required": [
          "group",
          "thresholds",
          "history",
          "active_mode",
          "min_tests",
          "min_persons",
          "modes"
        ],
        "properties": {
          "group": {
            "allOf": [
              {
                "$ref": "#/components/schemas/VoiceFingerprintGroup"
              }
            ],
            "nullable": true,
            "description": "Groupe actif ; null tant qu'aucune empreinte n'a été produite."
          },
          "thresholds": {
            "allOf": [
              {
                "$ref": "#/components/schemas/VoiceGroupThresholds"
              }
            ],
            "nullable": true,
            "description": "Seuils appliqués au groupe ; null : suggestions seulement, aucune Attribution automatique."
          },
          "history": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VoiceGroupThresholds"
            },
            "description": "Vingt dernières versions, la plus récente d'abord."
          },
          "active_mode": {
            "type": "string",
            "enum": [
              "cumulative",
              "best_sample"
            ]
          },
          "min_tests": {
            "type": "integer"
          },
          "min_persons": {
            "type": "integer"
          },
          "modes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VoiceCalibrationMode"
            }
          }
        }
      }
    }
  }
}
