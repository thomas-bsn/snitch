        }
      },
      "MicrophoneTrackRuleInput": {
        "type": "object",
        "additionalProperties": false,
        "required": ["person_id"],
        "properties": {
          "audio_stream_index": {"type": "integer", "minimum": 0, "description": "Index global FFmpeg d'une piste détectée."},
          "title": {"type": "string", "minLength": 1, "maxLength": 200, "description": "Titre exact (sans casse) d'une piste détectée."},
          "person_id": {"type": "integer", "format": "int64", "minimum": 1, "description": "Personne propriétaire du micro."}
        },
        "description": "Au moins un de audio_stream_index ou title ; si les deux sont donnés, la piste doit correspondre aux deux."
      },
      "MicrophoneTrackClipInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "disabled": {"type": "boolean", "description": "true : ce clip n'a pas de piste micro."},
          "audio_stream_index": {"type": "integer", "minimum": 0},
          "person_id": {"type": "integer", "format": "int64", "minimum": 1}
        },
        "description": "Soit disabled=true seul, soit audio_stream_index et person_id ensemble."
      },
      "MicrophoneDetectedTrack": {
        "type": "object",
        "required": ["audio_stream_index", "title", "language", "channels", "channel_layout", "clip_count"],
        "properties": {
          "audio_stream_index": {"type": "integer"},
          "title": {"type": "string"},
          "language": {"type": "string"},
          "channels": {"type": "integer"},
          "channel_layout": {"type": "string"},
          "clip_count": {"type": "integer", "description": "Nombre de clips prêts de la source portant cette piste."}
        }
      },
      "MicrophoneSourceRuleValue": {
        "type": "object",
        "required": ["audio_stream_index", "title", "person", "version", "updated_at"],
        "properties": {
          "audio_stream_index": {"type": "integer", "nullable": true},
          "title": {"type": "string", "nullable": true},
          "person": {"$ref": "#/components/schemas/PersonRef"},
          "version": {"type": "integer", "format": "int64"},
          "updated_at": {"type": "string", "format": "date-time"}
        }
      },
      "MicrophoneSourceRule": {
        "type": "object",
        "required": ["source_id", "rule", "detected_tracks", "status_counts"],
        "properties": {
          "source_id": {"type": "integer", "format": "int64"},
          "rule": {"allOf": [{"$ref": "#/components/schemas/MicrophoneSourceRuleValue"}], "nullable": true},
          "detected_tracks": {"type": "array", "items": {"$ref": "#/components/schemas/MicrophoneDetectedTrack"}},
          "status_counts": {"type": "object", "additionalProperties": {"type": "integer"}, "description": "Après une écriture : nombre de clips par état de désignation (designated, track_not_found, ambiguous_track, conflicting_sources, blocked_by_validation, owner_profile_deleted, disabled, none). Vide en lecture."}
        }
      },
      "MicrophoneTrackStatus": {
        "type": "string",
        "enum": ["none", "designated", "disabled", "track_not_found", "ambiguous_track", "conflicting_sources", "blocked_by_validation", "owner_profile_deleted"],
        "description": "none : aucune règle ; designated : piste micro résolue ; disabled : le clip n'a pas de piste micro ; track_not_found, ambiguous_track, conflicting_sources : la désignation ne correspond pas à une piste unique et n'est pas appliquée ; blocked_by_validation : la piste désignée porte des voix déjà validées par un humain ; owner_profile_deleted : le propriétaire désigné a supprimé son profil vocal, rien ne lui est attribué."
      },
      "MicrophoneTrackItem": {
        "type": "object",
        "required": ["index", "title", "language", "channels", "channel_layout", "role"],
        "properties": {
          "index": {"type": "integer"},
          "title": {"type": "string"},
          "language": {"type": "string"},
          "channels": {"type": "integer"},
          "channel_layout": {"type": "string"},
          "role": {"type": "string", "enum": ["microphone", "candidate", "other"], "description": "other : piste traitée normalement (diarisation)."}
        }
      },
      "MicrophoneSnapshot": {
        "type": "object",
        "properties": {
          "audio_stream_index": {"type": "integer"},
          "title": {"type": "string"},
          "disabled": {"type": "boolean"},
          "person": {"$ref": "#/components/schemas/PersonRef"}
        },
        "description": "Désignation telle qu'elle était, avec le nom de la Personne à l'époque."
      },
      "MicrophoneTrackEvent": {
        "type": "object",
        "required": ["id", "scope", "source_id", "action", "old_rule", "new_rule", "author", "created_at"],
        "properties": {
          "id": {"type": "integer", "format": "int64"},
          "scope": {"type": "string", "enum": ["source", "clip"]},
          "source_id": {"type": "integer", "format": "int64", "nullable": true},
          "action": {"type": "string", "enum": ["set", "remove", "disable"]},
          "old_rule": {"allOf": [{"$ref": "#/components/schemas/MicrophoneSnapshot"}], "nullable": true},
          "new_rule": {"allOf": [{"$ref": "#/components/schemas/MicrophoneSnapshot"}], "nullable": true},
          "author": {"allOf": [{"$ref": "#/components/schemas/AttributionAuthor"}], "nullable": true},
          "created_at": {"type": "string", "format": "date-time"}
        }
      },
      "ClipMicrophoneTrack": {
        "type": "object",
        "required": ["clip_id", "status", "selection_source", "audio_stream_index", "person", "candidates", "local_speaker_id", "applied", "tracks", "history"],
        "properties": {
          "clip_id": {"type": "integer", "format": "int64"},
          "status": {"$ref": "#/components/schemas/MicrophoneTrackStatus"},
          "selection_source": {"type": "string", "nullable": true, "enum": ["source_rule", "clip_override"]},
          "audio_stream_index": {"type": "integer", "nullable": true},
          "person": {"allOf": [{"$ref": "#/components/schemas/PersonRef"}], "nullable": true},
          "candidates": {"type": "array", "items": {"type": "integer"}, "description": "Pistes qui correspondent toutes à la règle (ambiguous_track)."},
          "local_speaker_id": {"type": "integer", "format": "int64", "nullable": true, "description": "Locuteur local de la piste micro, une fois la désignation appliquée."},
          "applied": {"type": "boolean"},
          "tracks": {"type": "array", "items": {"$ref": "#/components/schemas/MicrophoneTrackItem"}},
          "history": {"type": "array", "items": {"$ref": "#/components/schemas/MicrophoneTrackEvent"}, "description": "Changements de règle de la source et remplacements du clip, du plus récent au plus ancien (50 au plus)."}
        }
      },
      "AudioTrackSelection": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "selected",
              "selection_required"
            ]
          },
          "audio_stream_index": {
            "type": "integer",
            "minimum": 0
          },
          "selection_source": {
            "type": "string"
          },
          "rule_version": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "VocabularyTermInput": {
        "type": "object",
        "required": [
          "term",
          "variants",
          "preferred_spelling",
          "active"
        ],
        "properties": {
          "term": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "variants": {
            "type": "array",
            "maxItems": 30,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 160
            }
          },
          "preferred_spelling": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "active": {
            "type": "boolean"
          }
        }
      },
      "VocabularyTerm": {
        "allOf": [
          {
            "$ref": "#/components/schemas/VocabularyTermInput"
          }
        ],
        "type": "object",
        "required": [
          "id"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "VocabularyList": {
        "type": "object",
        "required": [
          "items",
          "version"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VocabularyTerm"
            }
          },
          "version": {
            "type": "string"
          }
        }
      },
      "WorkerVocabularyTerm": {
        "type": "object",
        "required": [
          "term",
          "variants",
          "preferred_spelling"
        ],
        "properties": {
          "term": {
            "type": "string"
          },
          "variants": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "preferred_spelling": {
            "type": "string"
          }
        }
      },
      "SearchResult": {
        "type": "object",
        "required": [
          "clip_id",
          "clip_name",
          "visibility",
          "recorded_at",
          "status",
          "sources",
          "match_type",
          "context",
          "matched_text",
          "timestamp",
          "corrected",
          "person",
          "decision_level"
        ],
        "properties": {
          "corrected": {"type": "boolean", "description": "Vrai si le contexte est le texte corrigé du segment (phase 6) ; la recherche porte toujours sur le texte effectif, jamais sur l’ancien texte remplacé."},
          "person": {"allOf": [{"$ref": "#/components/schemas/PersonRef"}], "nullable": true, "description": "Personne identifiée de la voix qui parle le segment ; null si inconnue, suggestion ou ambiguïté."},
          "decision_level": {"allOf": [{"$ref": "#/components/schemas/DecisionLevel"}], "description": "Niveau de décision tracé de l’attribution effective ; unknown sans attribution ou sans voix détectée."},
          "clip_id": {
            "type": "integer",
            "format": "int64"
          },
          "clip_name": {
            "type": "string"
          },
          "visibility": {
            "type": "string",
            "enum": [
              "shared",
              "private"
            ]
          },
          "recorded_at": {"type": "string", "format": "date-time", "nullable": true},
          "status": {
            "type": "string",
            "enum": [
              "ready",
              "waiting_stability",
              "unreadable",
              "missing"
            ]
          },
          "sources": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "match_type": {
            "type": "string",
            "enum": [
              "exact",
              "full_text",
              "approximate",
              "hybrid",
              "semantic"
            ]
          },
          "context": {
            "type": "string"
          },
          "matched_text": {
            "type": "string"
          },
          "timestamp": {
            "type": "number",
            "format": "double",
            "minimum": 0
          }
        }
      },
      "SearchPage": {
        "type": "object",
        "required": [
          "items",
          "page",
          "page_size",
          "total"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SearchResult"
            }
          },
          "page": {
            "type": "integer"
          },
          "page_size": {
            "type": "integer"
          },
          "total": {
            "type": "integer"
          },
          "degraded": {
            "type": "boolean",
            "description": "Vrai si la recherche sémantique n’a pas pu être utilisée et que le plein texte a pris le relais."
          }
        }
      }
    }
  }
}
