    "/api/admin/worker-updates": {
      "get": {
        "operationId": "getWorkerUpdates",
        "description": "Version cible de mise à jour automatique des Workers, catalogue des versions publiées et dernier statut de chaque Worker (ADR 0036).",
        "responses": {
          "200": {
            "description": "État des mises à jour",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "mode",
                    "target_version",
                    "target_image",
                    "latest_version",
                    "checked_at",
                    "check_failed",
                    "image_repository",
                    "catalog",
                    "catalog_available",
                    "workers"
                  ],
                  "properties": {
                    "mode": {
                      "type": "string",
                      "enum": [
                        "disabled",
                        "pinned",
                        "latest"
                      ],
                      "description": "Stratégie choisie. La version effective (target_version) est celle de l'administrateur en pinned, la plus haute version publiée déjà vue en latest."
                    },
                    "latest_version": {
                      "type": "string",
                      "nullable": true,
                      "description": "Version stable la plus récente du catalogue, indépendamment du mode."
                    },
                    "checked_at": {
                      "type": "string",
                      "nullable": true,
                      "format": "date-time",
                      "description": "Dernière interrogation du registre par ce serveur (mémoire du processus), nulle tant qu'aucune n'a eu lieu."
                    },
                    "check_failed": {
                      "type": "boolean",
                      "description": "Vrai si la dernière interrogation du registre a échoué ; la dernière cible valide est conservée."
                    },
                    "target_version": {
                      "type": "string",
                      "nullable": true,
                      "pattern": "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
                    },
                    "target_image": {
                      "type": "string",
                      "nullable": true
                    },
                    "image_repository": {
                      "type": "string"
                    },
                    "catalog": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "catalog_available": {
                      "type": "boolean"
                    },
                    "workers": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "required": [
                          "id",
                          "name",
                          "state",
                          "version",
                          "digest",
                          "cause_code"
                        ],
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "state": {
                            "type": "string",
                            "enum": [
                              "",
                              "idle",
                              "pulling",
                              "restarting",
                              "updated",
                              "rolled_back",
                              "failed"
                            ]
                          },
                          "version": {
                            "type": "string"
                          },
                          "digest": {
                            "type": "string"
                          },
                          "cause_code": {
                            "type": "string"
                          },
                          "reported_at": {
                            "type": "string",
                            "nullable": true,
                            "format": "date-time"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "putWorkerUpdateTarget",
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "description": "Choisit la stratégie : disabled (aucune mise à jour), pinned (version fixe, obligatoire) ou latest (suivi de la dernière version publiée, la version envoyée est ignorée). Sans mode, il est déduit de la version (vide : disabled). Le format est vérifié ; l'image est construite par Snitch à partir du dépôt configuré.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "version"
                ],
                "properties": {
                  "mode": {
                    "type": "string",
                    "enum": [
                      "disabled",
                      "pinned",
                      "latest"
                    ]
                  },
                  "version": {
                    "type": "string",
                    "nullable": true,
                    "maxLength": 40
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Cible enregistrée",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "mode",
                    "target_version"
                  ],
                  "properties": {
                    "mode": {
                      "type": "string",
                      "enum": [
                        "disabled",
                        "pinned",
                        "latest"
                      ]
                    },
                    "target_version": {
                      "type": "string",
                      "nullable": true
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
