    "/api/admin/clips/{id}/metadata": {
      "put": {
        "operationId": "putClipMetadata",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "status"
                  ]
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "game_changed": {
                    "type": "boolean"
                  },
                  "recorded_at_changed": {
                    "type": "boolean"
                  },
                  "display_title": {
                    "type": "string",
                    "nullable": true,
                    "description": "Titre affiché (200 caractères au plus, sans caractère de contrôle) ; vide ou absent pour le retirer. N'agit que si display_title_changed est vrai ; ne renomme jamais le fichier."
                  },
                  "display_title_changed": {
                    "type": "boolean"
                  },
                  "game_reset": {
                    "type": "boolean",
                    "description": "Restaure le jeu détecté automatiquement ; 409 metadata_reset_unavailable s'il n'est pas disponible. Exclusif avec game_changed."
                  },
                  "recorded_at_reset": {
                    "type": "boolean",
                    "description": "Restaure la date détectée automatiquement ; 409 metadata_reset_unavailable s'il n'est pas disponible. Exclusif avec recorded_at_changed."
                  },
                  "game": {
                    "type": "string",
                    "nullable": true
                  },
                  "recorded_at": {
                    "type": "string",
                    "format": "date-time",
                    "nullable": true
                  }
                },
                "required": []
              }
            }
          }
        }
      }
    },
