                    },
                    "target_version": {
                      "type": "string",
                      "nullable": true,
                      "pattern": "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
                    },
                    "target_image": {
                      "type": "string",
                      "nullable": true
                    },
                    "image_repository": {
                      "type": "string"
                    },
                    "catalog": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "catalog_available": {
                      "type": "boolean"
                    },
                    "workers": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "required": [
                          "id",
                          "name",
                          "state",
                          "version",
                          "digest",
                          "cause_code"
                        ],
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "state": {
                            "type": "string",
                            "enum": [
                              "",
                              "idle",
                              "pulling",
                              "restarting",
                              "updated",
                              "rolled_back",
                              "failed"
                            ]
                          },
                          "version": {
                            "type": "string"
                          },
                          "digest": {
                            "type": "string"
                          },
                          "cause_code": {
                            "type": "string"
                          },
                          "reported_at": {
                            "type": "string",
                            "nullable": true,
                            "format": "date-time"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "putWorkerUpdateTarget",
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
