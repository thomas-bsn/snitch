            "$ref": "#/components/schemas/AudioTrackRule"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "CorrectionsToReplace": {
        "type": "object",
        "description": "Corrections humaines actives de la transcription visible d'un clip, que la retranscription remplacerait (elles resteraient dans l'historique, obsolètes).",
        "required": [
          "transcription_job_id",
          "text_segments",
          "speaker_segments",
          "authors",
          "last_corrected_at"
        ],
        "properties": {
          "transcription_job_id": {
            "type": "integer",
            "format": "int64"
          },
          "text_segments": {
            "type": "integer",
            "minimum": 0
          },
          "speaker_segments": {
            "type": "integer",
            "minimum": 0
          },
          "authors": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "last_corrected_at": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        }
      },
