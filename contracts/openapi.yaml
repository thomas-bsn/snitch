    "/api/library/explorer": {
      "get": {
        "operationId": "listLibraryExplorer",
        "summary": "Explorateur de la Racine vidéo : dossiers et vidéos croisés avec la base, paginés côté serveur (ADR 0032)",
        "parameters": [
          {
            "in": "query",
            "name": "path",
            "schema": {
              "type": "string"
            },
            "description": "Dossier relatif à la Racine vidéo (vide : la racine)"
          },
          {
            "in": "query",
            "name": "recursive",
            "schema": {
              "type": "string",
              "enum": [
                "1",
                "true"
              ]
            },
            "description": "Liste à plat tous les descendants"
          },
          {
            "in": "query",
            "name": "q",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "state",
            "schema": {
              "type": "string",
              "enum": [
                "not_indexed",
                "in_progress",
                "not_analyzed",
                "transcribed",
                "analyzed",
                "failed"
              ]
            }
          },
          {
            "in": "query",
            "name": "stage",
            "schema": {
              "type": "string",
              "enum": [
                "indexed",
                "transcribed",
                "voices",
                "complete"
              ]
            },
            "description": "Étape de traitement atteinte : indexed (le clip existe), transcribed (transcription exploitable), voices (diarisation, empreintes et rapprochement terminés), complete (toutes les étapes de l'analyse terminées). Sans recursive, la réponse est l'arbre élagué : les vidéos du dossier qui correspondent et les seuls sous-dossiers menant à une correspondance, avec match_count."
          },
          {
            "in": "query",
            "name": "game",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "visibility",
            "schema": {
              "type": "string",
              "enum": [
                "shared",
                "private"
              ]
            }
          },
          {
            "in": "query",
            "name": "from",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "in": "query",
            "name": "to",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "in": "query",
            "name": "owner_id",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "in": "query",
            "name": "person_id",
            "schema": {
              "type": "integer",
              "minimum": 1
            },
            "description": "Vidéos dont une voix est attribuée à cette Personne (attribution validée ou automatique)"
          },
          {
            "in": "query",
            "name": "voices",
            "schema": {
              "type": "string",
              "enum": [
                "pending"
              ]
            },
            "description": "Vidéos qui ont encore des voix à traiter"
          },
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500,
              "default": 100
            }
          },
          {
            "in": "query",
            "name": "offset",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Une page de la sélection",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExplorerListing"
                }
              }
            }
          },
          "default": {
            "description": "Erreur",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
