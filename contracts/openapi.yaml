    "/api/worker/update-status": {
      "post": {
        "operationId": "postWorkerUpdateStatus",
        "security": [
          {
            "workerBearer": []
          }
        ],
        "description": "Statut de l'agent local après une tentative de mise à jour. Aucun texte libre : code de cause stable, empreinte de l'image tirée.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "state",
                  "version"
                ],
                "properties": {
                  "state": {
                    "type": "string",
                    "enum": [
                      "idle",
                      "pulling",
                      "restarting",
                      "updated",
                      "rolled_back",
                      "failed"
                    ]
                  },
                  "version": {
                    "type": "string",
                    "pattern": "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
                  },
                  "digest": {
                    "type": "string",
                    "pattern": "^(sha256:[a-f0-9]{64})?$"
                  },
