          "model": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "language": {
            "type": "string"
          },
          "transcription_job_id": {
            "type": "integer",
            "format": "int64",
            "description": "Tâche de transcription visible : avec l'index, l'identité d'un segment."
          },
          "audio_stream_index": {
            "type": "integer",
            "minimum": 0
          },
          "local_speakers": {"type": "array", "description": "Locuteurs locaux de la piste audio, désignables pour un segment ; absent sans diarisation.", "items": {"type": "object", "required": ["id", "label"], "properties": {"id": {"type": "integer", "format": "int64"}, "label": {"type": "string"}}}},
          "segments": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/TranscriptSegment"
            }
          }
        }
      },
      "AudioTrackRule": {
