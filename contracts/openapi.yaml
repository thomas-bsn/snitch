          {
            "in": "query",
            "name": "name",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 255
            },
            "description": "Nom du dossier"
          },
          {
            "in": "query",
            "name": "path",
            "schema": {
              "type": "string",
              "maxLength": 1024
            },
            "description": "Dossier relatif à la Racine vidéo : cherche d'abord son logo personnalisé"
          },
          {
            "in": "query",
