    "schemas": {
      "EmbeddingSettings": {"type": "object", "required": ["url", "model", "url_from_environment", "model_from_environment"], "properties": {"url": {"type": "string"}, "model": {"type": "string"}, "url_from_environment": {"type": "boolean"}, "model_from_environment": {"type": "boolean"}}},
      "ClipAnalysisStep": {"type": "object", "required": ["step", "status", "reason", "job_id", "attempt", "input_version", "profile", "forced", "started_at", "finished_at", "updated_at"], "properties": {"step": {"type": "string", "enum": ["preparation", "transcription", "indexing", "diarization", "fingerprints", "matching"]}, "status": {"type": "string", "enum": ["waiting", "running", "retry", "blocked", "failed", "done", "not_applicable", "not_yet_supported"]}, "reason": {"type": "string", "description": "Code stable : awaiting_preparation, awaiting_previous_step, clip_not_ready, audio_track_selection_required, clip_ready, awaiting_worker, awaiting_compatible_worker, run_cancelled, running, retry_scheduled, completed, reused_existing, kept_for_corrections, job_dead, job_cancelled, job_failed, outside_scope, transcription_required, awaiting_transcription, awaiting_indexer, semantic_search_unavailable, semantic_index_failed, microphone_track, microphone_direct_attribution, no_speakers, awaiting_fingerprints, matching_failed, upstream_failed."}, "job_id": {"type": "integer", "nullable": true, "format": "int64"}, "attempt": {"type": "integer"}, "input_version": {"type": "string", "nullable": true, "description": "Version d'entrée du job suivi par l'étape (historique)."}, "profile": {"type": "string", "nullable": true, "description": "Profil (pipeline) du job suivi par l'étape."}, "forced": {"type": "boolean", "description": "Étape relancée par une réanalyse, malgré un résultat valide."}, "started_at": {"type": "string", "nullable": true, "format": "date-time"}, "finished_at": {"type": "string", "nullable": true, "format": "date-time"}, "updated_at": {"type": "string", "format": "date-time"}}},
      "ClipAnalysisRun": {"type": "object", "required": ["id", "clip_id", "scope", "status", "started_by", "created_at", "updated_at", "finished_at", "mode", "forced_steps", "confirmed_replace_corrections", "confirmed_replace_validations", "steps"], "properties": {"id": {"type": "integer", "format": "int64"}, "clip_id": {"type": "integer", "format": "int64"}, "scope": {"type": "string", "enum": ["transcription", "voice", "full"]}, "status": {"type": "string", "enum": ["active", "completed", "incomplete", "failed", "cancelled"]}, "started_by": {"type": "integer", "nullable": true, "format": "int64"}, "created_at": {"type": "string", "format": "date-time"}, "updated_at": {"type": "string", "format": "date-time"}, "finished_at": {"type": "string", "nullable": true, "format": "date-time"}, "mode": {"type": "string", "enum": ["missing", "full", "steps"]}, "forced_steps": {"type": "array", "items": {"type": "string", "enum": ["transcription", "indexing", "diarization"]}}, "confirmed_replace_corrections": {"type": "boolean"}, "confirmed_replace_validations": {"type": "boolean"}, "steps": {"type": "array", "items": {"$ref": "#/components/schemas/ClipAnalysisStep"}}}},
      "ClipAnalysisResponse": {"type": "object", "required": ["run"], "properties": {"run": {"allOf": [{"$ref": "#/components/schemas/ClipAnalysisRun"}], "nullable": true}}},
      "AnalysisQueueRun": {"allOf": [{"$ref": "#/components/schemas/ClipAnalysisRun"}, {"type": "object", "required": ["clip_name"], "properties": {"clip_name": {"type": "string"}}}]},
      "AnalysisQueueTask": {"allOf": [{"$ref": "#/components/schemas/Job"}, {"type": "object", "required": ["clip_name"], "properties": {"clip_name": {"type": "string"}}}]},
