        "responses": {"200": {"description": "Exclusion levée (idempotent)", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VoiceGroupExclusion"}}}}, "default": {"description": "Erreur", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}},
