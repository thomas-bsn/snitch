services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a published pinned image}
    environment:
      POSTGRES_USER: receipts
      POSTGRES_DB: receipts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, max_connections=30]
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U receipts -d receipts]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    x-forgeyard:
      memory: 512
      backup: {type: postgres}
  migrate:
    image: ${SNITCH_IMAGE:?Set SNITCH_IMAGE to a built or published immutable image}
    command: [migrate]
    environment:
      DATABASE_URL: postgres://receipts@postgres:5432/receipts?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    x-forgeyard: {memory: 256}
  app:
    image: ${SNITCH_IMAGE:?Set SNITCH_IMAGE to a built or published immutable image}
    command: [serve]
    environment:
      DATABASE_URL: postgres://receipts@postgres:5432/receipts?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DISPLAY_NAME: ${DISPLAY_NAME:-Snitch}
      CLIPS_ROOTS: ${CLIPS_ROOTS:-}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      CLIP_STABILITY_WINDOW: ${CLIP_STABILITY_WINDOW:-3s}
      SOURCE_RECONCILE_INTERVAL: ${SOURCE_RECONCILE_INTERVAL:-5m}
      CLIP_EXCLUDE_PATTERNS: ${CLIP_EXCLUDE_PATTERNS:-.*,*.tmp,*.part,*.partial,*.crdownload,*.download}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/media}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-21474836480}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-4194304}
      UPLOAD_SESSION_TTL: ${UPLOAD_SESSION_TTL:-168h}
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://embed:11434/v1/embeddings}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      GOMEMLIMIT: 300MiB
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /snitch, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes: [media:/data/media]
    x-forgeyard:
      memory: 384
      expose: {port: 8080}
  embed:
    image: ${EMBED_IMAGE:?Set EMBED_IMAGE to a published pinned image}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes: [embeddings:/root/.ollama]
    restart: unless-stopped
    x-forgeyard: {memory: 1536}
volumes:
  database:
  embeddings:
  media:
