services:
  # Tâche unique : produit le mot de passe de la base au premier démarrage (ou reprend POSTGRES_PASSWORD s'il
  # est fourni) et le conserve dans le volume secrets. Elle ne l'affiche jamais.
  secrets:
    image: ${SNITCH_IMAGE:-ghcr.io/thomas-bsn/snitch:latest}
    command: [init-secrets]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: [secrets:/data/secrets]
    restart: "no"
    x-forgeyard: {memory: 64}
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11}
    environment:
      POSTGRES_USER: receipts
      POSTGRES_DB: receipts
      POSTGRES_PASSWORD_FILE: /run/snitch-secrets/postgres_password
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, max_connections=30]
    volumes: [database:/var/lib/postgresql, "secrets:/run/snitch-secrets:ro"]
    depends_on:
      secrets: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U receipts -d receipts]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    x-forgeyard:
      memory: 512
      backup: {type: postgres}
  migrate:
    image: ${SNITCH_IMAGE:-ghcr.io/thomas-bsn/snitch:latest}
    command: [migrate]
    environment:
      DATABASE_URL: postgres://receipts@postgres:5432/receipts?sslmode=disable
      POSTGRES_PASSWORD_FILE: /data/secrets/postgres_password
    volumes: ["secrets:/data/secrets:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    x-forgeyard: {memory: 256}
  app:
    image: ${SNITCH_IMAGE:-ghcr.io/thomas-bsn/snitch:latest}
    command: [serve]
    environment:
      DATABASE_URL: postgres://receipts@postgres:5432/receipts?sslmode=disable
      POSTGRES_PASSWORD_FILE: /data/secrets/postgres_password
      # Facultative : sans valeur, l'application génère sa clé maître au premier démarrage et la conserve dans le
      # volume secrets (écriture réservée à l'application). Une valeur fournie reste prioritaire.
      MASTER_KEY: ${MASTER_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      WORKER_IMAGE: ${WORKER_IMAGE:-}
      CLIPS_ROOTS: ${CLIPS_ROOTS:-}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      CLIP_STABILITY_WINDOW: ${CLIP_STABILITY_WINDOW:-3s}
      SOURCE_RECONCILE_INTERVAL: ${SOURCE_RECONCILE_INTERVAL:-5m}
      CLIP_EXCLUDE_PATTERNS: ${CLIP_EXCLUDE_PATTERNS:-.*,*.tmp,*.part,*.partial,*.crdownload,*.download}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/media}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-21474836480}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-4194304}
      UPLOAD_SESSION_TTL: ${UPLOAD_SESSION_TTL:-168h}
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://embed:11434/v1/embeddings}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      GOMEMLIMIT: 300MiB
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /snitch, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes: [media:/data/media, "secrets:/data/secrets"]
    x-forgeyard:
      memory: 384
      expose: {port: 8080}
  embed:
    image: ${EMBED_IMAGE:-ollama/ollama:0.40.10@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes: [embeddings:/root/.ollama]
    restart: unless-stopped
    x-forgeyard: {memory: 1536}
volumes:
  database:
  embeddings:
  media:
  secrets:
