name: Toolchains
description: >
  Go, Node and Python at the versions pinned for Snitch, with the npm and pip caches and a rolling Go build cache.
  Call it after actions/checkout. Versions live here only, so that every job of verify.yml uses the same ones.
inputs:
  go:
    description: Install Go
    default: 'false'
  node:
    description: Install Node (npm cache on web/package-lock.json)
    default: 'false'
  python:
    description: Install Python (pip cache on the generators lock)
    default: 'false'
  go-cache:
    description: >
      Name of the Go module and build cache to restore ("lint" or "race": a race-instrumented build is a different
      set of objects). Empty: no cache.
    default: ''
  go-cache-save:
    description: >
      'true' saves the cache at the end of the job under a key of its own (one entry per commit, restored by prefix).
      Only the trusted pushes to main save: a pull request restores the latest entry of main and never writes.
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.27.3'
        cache: false
    - if: inputs.node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24.21.0'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - if: inputs.python == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12.15'
        cache: pip
        cache-dependency-path: contracts/generators/requirements.lock
    - if: inputs.go-cache != '' && inputs.go-cache-save != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.go-cache }}-${{ runner.os }}-${{ hashFiles('app/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ inputs.go-cache }}-${{ runner.os }}-${{ hashFiles('app/go.sum') }}-
          go-${{ inputs.go-cache }}-${{ runner.os }}-
    - if: inputs.go-cache != '' && inputs.go-cache-save == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.go-cache }}-${{ runner.os }}-${{ hashFiles('app/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ inputs.go-cache }}-${{ runner.os }}-${{ hashFiles('app/go.sum') }}-
          go-${{ inputs.go-cache }}-${{ runner.os }}-
