name: Verify and distribute
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    # Manual run on main only: "all" republishes every image (first publication, or recovery).
    inputs:
      all:
        description: Publish every image regardless of what changed
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 'stable'
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r contracts/generators/requirements.lock
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          cd web && npx playwright install --with-deps chromium
      - name: Check Go formatting and vet
        run: |
          gofmt -l app
          (cd app && go vet ./...)
      - name: Check web lint and TypeScript
        run: |
          npm --prefix web run lint
          echo "=== TypeScript version ==="
          npm --prefix web exec tsc --version
          echo "=== Node version ==="
          node --version
          echo "=== Checking problematic lines in errors.en.ts ==="
          sed -n '110,120p' web/src/app/i18n/errors.en.ts
          echo "=== Checking problematic lines in errors.fr.ts ==="
          sed -n '120,130p' web/src/app/i18n/errors.fr.ts
          echo "=== Running tsc --noEmit with traceResolution ==="
          npm --prefix web exec tsc --noEmit --traceResolution 2>&1 | head -100
          echo "=== Running build ==="
          npm --prefix web run build
      - name: Check generated files
        run: .venv/bin/python scripts/check_generated.py
      - name: Check compose
        run: .venv/bin/python scripts/check_compose.py
      - name: Check error codes
        run: .venv/bin/python scripts/check_error_codes.py
      - name: Run tests
        run: SNITCH_E2E=1 bash scripts/test.sh
  build:
    needs: check
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: |
          docker build -f deploy/docker/app.Dockerfile -t snitch-smoke:local .
          python scripts/smoke_compose.py snitch-smoke:local
      - name: Build the worker image (needs no GPU, never pushed)
        run: |
          docker system prune -af
          docker build -f deploy/docker/worker.Dockerfile -t snitch-worker:local .
          docker run --rm snitch-worker:local python -m pip check
  changes:
    # Decides what a push to main or a version tag must publish, and under which tags. Pure git: no third-party action (only the
    # pinned checkout). Any doubt (new branch, unknown or non-ancestor "before" such as after
    # a force-push, manual "all") publishes everything.
    # app    = what goes into deploy/docker/app.Dockerfile: app/, web/, the shared contracts/,
    #          the Dockerfile, compose.yaml (image names and tags), LICENSE,
    #          the ffmpeg licenses it copies and the notice/generation scripts it runs.
    # worker = what goes into deploy/docker/worker.Dockerfile: worker/ (code and locks), the
    #          shared contracts/ (generated client), the Dockerfile, collect_python_notices.py,
    #          deploy/licenses/** (voice extras) and LICENSE.
    # A version tag (v*) always publishes every image under that tag (consistent pinned versions);
    # main publishes "latest" plus an immutable sha-<commit> tag.
    needs: build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.diff.outputs.tags }}
      release: ${{ steps.diff.outputs.release }}
      app: ${{ steps.diff.outputs.app }}
      worker: ${{ steps.diff.outputs.worker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          everything=false
          release=false
          tags="latest sha-${SHA::7}"
          if [ "$REF_TYPE" = tag ]; then everything=true; release=true; tags="$REF_NAME"; fi
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$ALL" = true ]; then everything=true; else BEFORE=$(git rev-parse --verify -q "$SHA^" || true); fi
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$BEFORE" "$SHA"; then
            everything=true
          fi
          app=false; worker=false
          if [ "$everything" = true ]; then
            app=true; worker=true
          else
            files=$(git diff --name-only "$BEFORE" "$SHA")
            echo "$files"
            if echo "$files" | grep -Eq '^(app|web|contracts)/|^deploy/docker/app\.Dockerfile$|^compose\.yaml$|^deploy/licenses/ffmpeg/|^LICENSE$|^scripts/(collect_go_notices\.sh|collect_web_notices\.mjs|generate\.sh|normalize_generated_python\.py)$'; then app=true; fi
            if echo "$files" | grep -Eq '^(worker|contracts|deploy/licenses)/|^deploy/docker/worker\.Dockerfile$|^scripts/collect_python_notices\.py$|^LICENSE$'; then worker=true; fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "everything=$everything app=$app worker=$worker"
  publish-app:
    # Publishes the app image after build, only when the app changed (always for a version tag),
    # under the tags computed by "changes" (latest + sha on main, the version on a tag).
    # Never runs for pull requests or other branches.
    needs: [build, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Portable repository image namespace and tags
        env:
          TAG_NAMES: ${{ needs.changes.outputs.tags }}
        run: |
          IMAGE_ROOT="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_ROOT=$IMAGE_ROOT" >> "$GITHUB_ENV"
          {
            echo "IMAGE_TAGS<<EOF"
            for tag in $TAG_NAMES; do echo "$IMAGE_ROOT:$tag"; done
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
  publish-worker:
    # Same rules as publish-app, only when the worker changed (always for a version tag). The single worker image is large.
    needs: [build, changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free runner disk space for the worker image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Portable repository image namespace and tags
        env:
          TAG_NAMES: ${{ needs.changes.outputs.tags }}
        run: |
          IMAGE_ROOT="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_ROOT=$IMAGE_ROOT" >> "$GITHUB_ENV"
          {
            echo "IMAGE_TAGS<<EOF"
            for tag in $TAG_NAMES; do echo "$IMAGE_ROOT-worker:$tag"; done
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
