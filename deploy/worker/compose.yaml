# Worker Snitch (GPU NVIDIA requis pour des performances raisonnables) pour le PC de jeu (voir docs/real-voice-worker.md,
# section « Installer sur le PC gamer »). Ce fichier est un exemple autonome : il n'est pas
# lié au compose.yaml du NAS et n'est pas contrôlé par scripts/check_compose.py.
#
#   cp .env.example .env      # puis renseigner le jeton et les chemins (jamais versionné)
#   docker compose up -d
#
# Le worker ne publie aucun port : il appelle l'API Snitch en HTTPS sortant uniquement.
# Aucun modèle n'est dans l'image. Premier démarrage « tout automatique » (opt-in explicite) :
# avec SNITCH_VOICE_DOWNLOAD_ON_START=1, SNITCH_VOICE_CONFIRM_TERMS=1 et HF_TOKEN, la commande
# de démarrage (python -m snitch_worker.bootstrap) télécharge les modèles manquants dans le
# volume, puis lance le worker SANS HF_TOKEN et hors ligne. Sans opt-in, rien n'est téléchargé :
# les modèles doivent déjà être dans le volume (worker/scripts/download_models.py).
# Rotation des logs Docker (10 Mo x 5 fichiers par service) : le NAS ne se remplit pas.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "5"}
services:
  worker:
    logging: *logging
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    # Image publiée. IMPORTANT : le worker doit rester compatible avec l'application Snitch ;
    # épingler une étiquette de version (SNITCH_WORKER_IMAGE=ghcr.io/thomas-bsn/snitch-worker:vX.Y.Z,
    # la version de Snitch déployée) plutôt que « latest », qui suit la dernière publication.
    # pull_policy: always vérifie et met à jour l'image à chaque « docker compose up ».
    # Pour construire localement : SNITCH_WORKER_IMAGE=snitch-worker:local docker compose up --build
    image: ${SNITCH_WORKER_IMAGE:-ghcr.io/thomas-bsn/snitch-worker:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # Connexion à Snitch (secret dédié à ce worker, créé dans l'interface).
      SNITCH_API_URL: ${SNITCH_API_URL:?Renseigner SNITCH_API_URL (HTTPS) dans .env}
      SNITCH_WORKER_TOKEN: ${SNITCH_WORKER_TOKEN:?Renseigner SNITCH_WORKER_TOKEN dans .env}
      SNITCH_WORKER_CA_BUNDLE: ${SNITCH_WORKER_CA_BUNDLE:-}
      # Tâches simultanées (1 à 4) ; 1 recommandé pour garder la VRAM disponible.
      SNITCH_WORKER_CAPACITY: ${SNITCH_WORKER_CAPACITY:-1}
      # Niveau de log : ERROR, WARN, INFO (défaut) ou DEBUG.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SNITCH_WORKER_MACHINE_NAME: ${SNITCH_WORKER_MACHINE_NAME:-}
      # Fournisseur de transcription compatible OpenAI (Whisper local par exemple).
      TRANSCRIPTION_API_URL: ${TRANSCRIPTION_API_URL:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      # Modèles vocaux : chemins DANS le conteneur, sous le volume monté ci-dessous.
      SNITCH_VOICE_DIARIZATION_MODEL_PATH: ${SNITCH_VOICE_DIARIZATION_MODEL_PATH:-/models/diarization}
      SNITCH_VOICE_EMBEDDING_MODEL_PATH: ${SNITCH_VOICE_EMBEDDING_MODEL_PATH:-/models/embedding}
      # Facultatif : sinon lue du marqueur .snitch-voice-models.json écrit par le bootstrap.
      SNITCH_VOICE_EMBEDDING_MODEL_VERSION: ${SNITCH_VOICE_EMBEDDING_MODEL_VERSION:-}
      SNITCH_VOICE_EMBEDDING_MODEL_NAME: ${SNITCH_VOICE_EMBEDDING_MODEL_NAME:-pyannote/wespeaker-voxceleb-resnet34-LM}
      SNITCH_VOICE_DEVICE: ${SNITCH_VOICE_DEVICE:-cuda}
      # Bootstrap de démarrage (opt-in, voir l'en-tête). La version d'empreinte est lue du
      # marqueur du volume quand SNITCH_VOICE_EMBEDDING_MODEL_VERSION est vide.
      SNITCH_VOICE_DOWNLOAD_ON_START: ${SNITCH_VOICE_DOWNLOAD_ON_START:-0}
      SNITCH_VOICE_CONFIRM_TERMS: ${SNITCH_VOICE_CONFIRM_TERMS:-0}
      SNITCH_VOICE_MODEL_REVISION: ${SNITCH_VOICE_MODEL_REVISION:-}
      # Jeton Hugging Face : lu par le seul processus de bootstrap, retiré de l'environnement
      # du worker avant son lancement (le worker reste en HF_HUB_OFFLINE=1). Lecture seule suffit.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # Dossier hôte contenant diarization/ et embedding/. Inscriptible pour que le premier
      # démarrage y télécharge les modèles ; le worker, lui, ne fait que les lire. Si les modèles
      # sont déjà préparés et que l'opt-in est absent, on peut ajouter « :ro ».
      - ${SNITCH_MODELS_DIR:?Renseigner SNITCH_MODELS_DIR (dossier des modèles sur le PC)}:/models
    # Joindre un Whisper ou un Ollama qui tourne directement sur le PC (hors Docker) :
    # TRANSCRIPTION_API_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Accès GPU, comme un Ollama en Docker (NVIDIA Container Toolkit requis sur l'hôte).
    # Variante équivalente avec un Compose récent : « gpus: all ».
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Les modèles se partagent les 12 Go de VRAM de la RTX 4070 avec un éventuel Ollama :
    # laisser la capacité du worker à 1 (voir le guide) ; limiter la mémoire système si besoin.
    # mem_limit: 8g
    # Option : réseau Compose partagé avec un Ollama/Whisper lancé par un autre projet.
    # Décommenter ici ET en bas, puis viser le nom du service : http://ollama:11434
    # networks: [default, partage]
# networks:
#   partage:
#     external: true
#     name: ${SHARED_NETWORK:-ollama_default}
